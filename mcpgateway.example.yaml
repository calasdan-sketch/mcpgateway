# mcpgateway.yaml — one process fronting all your MCP servers.
# The config file is TRUSTED operator input (like sshd_config): it names the
# commands to spawn and the URLs to call. Keep it readable only by you
# (chmod 600) — it holds the credentials your servers need.

gateway:
  name: mcpgateway

servers:
  # stdio server: spawned with shell:false and an argv array (never a shell
  # string). The child inherits a small safe-default env (PATH, HOME, ...) plus
  # everything under `env` below.
  - name: github
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"   # ${VAR} and ${VAR:-default} supported
    concurrency: 1                      # stdio servers are usually single-threaded
    timeoutMs: 60000                    # per tool-call timeout

  # Streamable HTTP server.
  - name: docs
    transport: http
    url: http://localhost:8080/mcp
    headers:
      Authorization: "Bearer ${DOCS_TOKEN:-changeme}"
    concurrency: 8

namespace:
  strategy: prefix        # prefix | priority | explicit
  separator: "__"         # github + create_issue -> github__create_issue
  priority: [github]      # priority strategy: earlier wins the bare name
  mappings: {}            # explicit strategy: {"toolName": "winningServer"}
  aliases: {}             # {"server:tool": "friendlyName"}

rateLimits:
  default: { rps: 10, burst: 20 }
  tools:
    github__search_code: { rps: 2, burst: 4 }

policy:
  mode: enforce           # enforce | observe (observe logs would-be verdicts, forwards everything)
  allowTools: ["*"]       # glob patterns; deny wins over allow
  denyTools: []
  hideTools: []           # hidden from tools/list AND denied on call
  argRules: {}            # {"tool*": {deny: ["substring"], allow: ["substring"]}} — substring, not regex
  # How argRules compare. Each rule is tested against the JSON text AND every raw string
  # value/key (so a Windows path with backslashes matches). Default is exact; turn these
  # on for deny rules that guard paths or URLs:
  #   ignoreCase     "/ETC/Passwd" matches a "/etc/passwd" rule; invisible characters are
  #                  removed and full-width forms folded first
  #   normalizePaths backslash = slash, "//" "/./" "/../" collapsed, %-encoding decoded
  argMatch: { ignoreCase: false, normalizePaths: false }
  responseRedact: []      # substrings replaced with [REDACTED] in results
  responseBlock: []       # substrings that block the result entirely
  responseWarn: []        # substrings that only audit-log a warning
  # Rug-pull defense: pin each tool's description+schema (trust on first use).
  # "block" quarantines a changed tool until you accept it: POST /v1/pins/accept
  pinning:
    mode: off             # off | warn | block   (block requires a file)
    # file: ./mcpgateway-pins.json

auth:
  disabled: false
  keys:
    - id: agent-1
      key: "${GATEWAY_KEY}"     # unset = startup error (there is deliberately no default secret)
      # Or keep the secret out of this file: `mcpgateway hash-key --generate` prints a
      # key for the client and the keyHash to paste here instead of `key:`
      # keyHash: "sha256:..."
      scopes: ["tools:call", "tools:list"]   # + resources:*, prompts:*, admin
      # expiresAt: "2027-01-31T00:00:00Z"    # key stops working at this instant
      # readOnly: true                          # only tools whose server declared readOnlyHint: true
      # allowServers: ["github", "docs"]       # tools, resources and prompts of these servers only
      # Optional per-key limits (globs over public tool names; deny wins):
      # allowTools: ["github__search_*"]
      # denyTools: ["*__delete_*"]
      # rateLimit: { rps: 5, burst: 10 }       # budget across ALL of this key's calls

audit:
  path: ./mcpgateway-audit.jsonl
  logArgs: true           # false -> only a sha256 of args is logged
  redactKeys: [token, secret, password]      # key-name substrings, case-insensitive
  redactValues: true      # also redact credential shapes (Bearer/JWT/sk-/ghp_/AKIA/xox/PEM/URL passwords) in any value
  maxArgsChars: 8192
  maxSizeMB: 100
  keepFiles: 5
  chain: false            # true -> tamper-evident hash chain; check with: mcpgateway audit-verify <path>
  # chainKey: "${AUDIT_CHAIN_KEY}"   # optional HMAC secret (16+ chars); keep it off this host's disk

admin:
  enabled: true
  host: 127.0.0.1        # never 0.0.0.0 without allowPublicAdmin: true
  port: 3001
  # allowedHosts: ["gateway-admin.internal"]   # Host header names accepted (loopback binds accept loopback names only)

upstream:
  stdio: { enabled: true }                          # drop-in: swap the agent's server command
  http:
    enabled: false
    host: 127.0.0.1
    port: 3000
    maxSessions: 128    # idle sessions expire after 30 min; one key may hold at most half
    # DNS-rebinding defense. Loopback binds are protected by default; for a public
    # bind list your hostnames/origins here or Host/Origin are NOT checked.
    # allowedHosts: ["gateway.example.com"]
    # allowedOrigins: ["https://app.example.com"]

# Context-window saver: with many tools, list two meta-tools instead of all of
# them. The agent calls gateway_search_tools, then gateway_call_tool (policy,
# rate limits, per-key ACLs and audit apply exactly as for direct calls).
exposure:
  mode: full              # full | search
  alwaysExpose: []        # globs of tools that stay listed in search mode

globalMaxInflight: 256    # hard cap on concurrent tool calls gateway-wide
maxResultChars: 10000000  # drop tool results larger than this (OOM guard)
